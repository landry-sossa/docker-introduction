services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: landry
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  drupal:
    image: drupal:10-apache
    ports:
      - "8071:80"
    volumes:
      - drupal_data:/opt/drupal/web/sites
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
  drupal_data:
